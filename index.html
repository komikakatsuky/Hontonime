<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hontonime - Masuk / Daftar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #141414;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      background-color: #000000;
      border: 1px solid #222222;
      border-radius: 8px;
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }
    .brand-title {
      color: #e50914;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }
    .form-title {
      font-size: 18px;
      margin-bottom: 20px;
      text-align: center;
      color: #dddddd;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #aaaaaa;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 4px;
      border: 1px solid #333333;
      background-color: #222222;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: #e50914;
    }
    .btn-submit {
      width: 100%;
      background-color: #e50914;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #f40612;
    }
    .toggle-text {
      text-align: center;
      font-size: 13px;
      margin-top: 20px;
      color: #aaaaaa;
    }
    .toggle-link {
      color: #e50914;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    .toggle-link:hover {
      text-decoration: underline;
    }
    .message-box {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .message-box.error {
      background-color: rgba(229, 9, 20, 0.2);
      border: 1px solid #e50914;
      color: #ff6b6b;
      display: block;
    }
    .message-box.success {
      background-color: rgba(76, 175, 80, 0.2);
      border: 1px solid #4caf50;
      color: #81c784;
      display: block;
    }

    /* Tampilan Dashboard Setelah Login */
    .dashboard-card {
      display: none;
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      border: 1px solid #333;
    }
    .user-info {
      background-color: #121212;
      padding: 15px;
      border-radius: 6px;
      margin: 20px 0;
      word-break: break-all;
    }
    .btn-logout {
      background-color: #333333;
      color: #ffffff;
      border: 1px solid #444444;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-logout:hover {
      background-color: #444444;
    }
  </style>

  <!-- FIREBASE SDK v10 (MODULAR) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. TEMPELKAN FIREBASE CONFIG KAMU DI SINI
    const firebaseConfig = {
      apiKey: "AIzaSyXXXXXXXXXXXXXX",
      authDomain: "hontonime-app.firebaseapp.com",
      projectId: "hontonime-app",
      storageBucket: "hontonime-app.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isRegisterMode = false;

    // 2. CEK STATUS LOGIN USER secara Realtime
    onAuthStateChanged(auth, async (user) => {
      const authCard = document.getElementById("authCard");
      const dashboardCard = document.getElementById("dashboardCard");

      if (user) {
        // Ambil Data Profil dari Firestore
        let username = "-";
        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) {
            username = userDoc.data().username || "-";
          }
        } catch (e) {
          console.error("Gagal mengambil data user:", e);
        }

        authCard.style.display = "none";
        dashboardCard.style.display = "block";
        document.getElementById("displayEmail").innerText = user.email;
        document.getElementById("displayUsername").innerText = username;
      } else {
        authCard.style.display = "block";
        dashboardCard.style.display = "none";
      }
    });

    // 3. PROSES SUBMIT FORM (LOGIN / REGISTER)
    window.handleSubmit = async function() {
      const email = document.getElementById("inputEmail").value.trim();
      const password = document.getElementById("inputPassword").value.trim();
      const username = document.getElementById("inputUsername").value.trim();
      const msgBox = document.getElementById("messageBox");

      msgBox.className = "message-box";
      msgBox.style.display = "none";

      if (!email || !password) {
        showMessage("Email dan Password tidak boleh kosong!", "error");
        return;
      }

      if (isRegisterMode && !username) {
        showMessage("Nama Pengguna (Username) wajib diisi!", "error");
        return;
      }

      try {
        if (isRegisterMode) {
          // PROSES REGISTER
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // Simpan Informasi User Baru ke Firestore
          await setDoc(doc(db, "users", user.uid), {
            username: username,
            email: email,
            createdAt: new Date().toISOString()
          });

          showMessage("Registrasi berhasil! Mengalihkan...", "success");
        } else {
          // PROSES LOGIN
          await signInWithEmailAndPassword(auth, email, password);
          showMessage("Login berhasil!", "success");
        }
      } catch (error) {
        let errorMsg = error.message;
        
        // Format pesan error umum dari Firebase
        if (error.code === "auth/email-already-in-use") {
          errorMsg = "Email sudah terdaftar. Silakan login.";
        } else if (error.code === "auth/invalid-credential" || error.code === "auth/user-not-found" || error.code === "auth/wrong-password") {
          errorMsg = "Email atau password salah!";
        } else if (error.code === "auth/weak-password") {
          errorMsg = "Password minimal 6 karakter.";
        }

        showMessage(errorMsg, "error");
      }
    };

    // 4. PROSES LOGOUT
    window.handleLogout = function() {
      signOut(auth);
    };

    // 5. TOGGLE MODE (Tukar Mode Login <-> Register)
    window.toggleMode = function() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById("formTitle");
      const btn = document.getElementById("btnSubmit");
      const toggleBtn = document.getElementById("toggleLink");
      const usernameGroup = document.getElementById("usernameGroup");
      const msgBox = document.getElementById("messageBox");

      msgBox.style.display = "none";

      if (isRegisterMode) {
        title.innerText = "Daftar Akun Baru";
        btn.innerText = "Daftar";
        toggleBtn.innerText = "Masuk";
        document.getElementById("toggleQuestion").innerText = "Sudah punya akun? ";
        usernameGroup.style.display = "block";
      } else {
        title.innerText = "Masuk ke Akun";
        btn.innerText = "Masuk";
        toggleBtn.innerText = "Daftar sekarang";
        document.getElementById("toggleQuestion").innerText = "Belum punya akun? ";
        usernameGroup.style.display = "none";
      }
    };

    function showMessage(text, type) {
      const msgBox = document.getElementById("messageBox");
      msgBox.innerText = text;
      msgBox.className = `message-box ${type}`;
    }
  </script>
</head>
<body>

  <!-- KARTU FORM AUTH (LOGIN & REGISTER) -->
  <div class="auth-card" id="authCard">
    <div class="brand-title">HONTONIME</div>
    <div class="form-title" id="formTitle">Masuk ke Akun</div>

    <div class="form-group" id="usernameGroup" style="display: none;">
      <label for="inputUsername">Nama Pengguna (Username)</label>
      <input type="text" id="inputUsername" class="form-input" placeholder="Masukkan nama kamu">
    </div>

    <div class="form-group">
      <label for="inputEmail">Email</label>
      <input type="email" id="inputEmail" class="form-input" placeholder="contoh@email.com" required>
    </div>

    <div class="form-group">
      <label for="inputPassword">Kata Sandi</label>
      <input type="password" id="inputPassword" class="form-input" placeholder="Minimal 6 karakter" required>
    </div>

    <button class="btn-submit" id="btnSubmit" onclick="handleSubmit()">Masuk</button>

    <div class="message-box" id="messageBox"></div>

    <div class="toggle-text">
      <span id="toggleQuestion">Belum punya akun? </span>
      <span class="toggle-link" id="toggleLink" onclick="toggleMode()">Daftar sekarang</span>
    </div>
  </div>

  <!-- KARTU DASHBOARD (SETELAH LOGIN) -->
  <div class="dashboard-card" id="dashboardCard">
    <h2 style="color: #e50914; margin-bottom: 10px;">Selamat Datang!</h2>
    <p style="color: #aaa; font-size: 14px;">Kamu telah berhasil masuk ke Hontonime.</p>

    <div class="user-info">
      <p style="font-size: 12px; color: #888;">NAMA PENGGUNA</p>
      <p id="displayUsername" style="font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 10px;">-</p>
      
      <p style="font-size: 12px; color: #888;">EMAIL AKUN</p>
      <p id="displayEmail" style="font-size: 14px; color: #eee;">-</p>
    </div>

    <button class="btn-logout" onclick="handleLogout()">Keluar (Logout)</button>
  </div>

</body>
</html>
